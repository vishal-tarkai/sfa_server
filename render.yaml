# Render Blueprint — optional; you can also set these in the dashboard.
services:
  - type: web
    name: sfa-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SUPABASE_URL
        value: https://dltaekvsotstzhlqbcdv.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_q3Ib571Z2vwMwjtL0jeqkA_nqG90LAA
      - key: ATTENDANCE_OFFICE_LAT
        value: "30.512355"
      - key: ATTENDANCE_OFFICE_LNG
        value: "76.807612"
      - key: ATTENDANCE_OFFICE_RADIUS_METERS
        value: "500"
      - key: ATTENDANCE_SKIP_GEOFENCE
        value: "true"
      # CMS forgot-password — set SENDGRID_API_KEY in Render (Secret). Sender must be verified in SendGrid.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        value: "Cms <noreply@tarkai.com>"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "CMS <onboarding@resend.dev>"
